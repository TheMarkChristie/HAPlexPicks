# The Watch dashboard: one panel view, the Plex Picks card alone, full width. Deployed to Norway by
# tools/deploy_watch_dashboard.py (url_path plex-watch, sidebar title Watch).
title: Watch
views:
  - title: Watch
    path: watch
    icon: mdi:movie-open-play
    type: panel
    cards:
      - type: custom:plex-picks-card
        rows:
          - continue
          - because
          - picked
          - again
          - shortlist      # any other Shortlist row, whatever it has been renamed to
          - recent
        libraries:
          - Movies
          - TV Shows
